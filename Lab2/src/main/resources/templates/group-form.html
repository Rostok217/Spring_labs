
<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма групи | Деканат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            background: #f4f6fb;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 12px 0 20px;
        }
        button, a {
            padding: 10px 18px;
            background: #3267bb;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <h1 th:text="${group.id == null ? 'Додати групу' : 'Редагувати групу'}">
        Група
    </h1>

    <form th:action="@{/groups/save}"
          th:object="${group}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Назва групи:</label>
        <input type="text" th:field="*{name}"
               placeholder="Наприклад, ІА-43" required>

        <button type="submit">Зберегти</button>
        <a th:href="@{/groups}">Скасувати</a>
    </form>
</div>

</body>
</html>
