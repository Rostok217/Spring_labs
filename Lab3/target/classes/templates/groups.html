<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Групи | Деканат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 950px;
            margin: 40px auto;
            background: #f4f6fb;
            color: #263347;
        }
        h1 { color: #203b67; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }
        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #203b67;
            color: white;
        }
        a, button {
            display: inline-block;
            padding: 8px 12px;
            margin: 3px;
            border: none;
            border-radius: 5px;
            background: #3267bb;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }
        button.delete { background: #c83e4d; }
        form { display: inline; }
        .notice { background: #eaf0fa; border-left: 4px solid #3267bb;
                  padding: 12px 16px; margin-top: 20px; }
        .empty { text-align: center; padding: 20px; }

    </style>
</head>
<body>

<h1>Деканат — навчальні групи</h1>

<a th:href="@{/groups/new}">+ Додати групу</a>
<a th:href="@{/students}">Переглянути студентів</a>

<!-- ЛР3, п. 2.2: вибір варіанта повідомлення за допомогою switch/case. -->
<div class="notice" th:switch="${#lists.size(groups)}">
    <span th:case="0">У деканаті поки немає навчальних груп.</span>
    <span th:case="1">У деканаті зареєстрована одна навчальна група.</span>
    <span th:case="*">Кількість навчальних груп: <strong th:text="${#lists.size(groups)}">0</strong></span>
</div>

<!-- ЛР3, п. 2.1: умова відображення та п. 2.3: цикл -->
<table th:if="${!#lists.isEmpty(groups)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Назва групи</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="group : ${groups}">
        <td th:text="${group.id}"></td>
        <td th:text="${group.name}"></td>
        <td>
            <a th:href="@{/groups/edit/{id}(id=${group.id})}">
                Редагувати
            </a>
            <form th:action="@{/groups/delete/{id}(id=${group.id})}"
                  method="post">
                <button class="delete" type="submit"
                        onclick="return confirm('Видалити групу та її студентів?')">
                    Видалити
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p class="notice empty" th:if="${#lists.isEmpty(groups)}">
    Додайте першу групу за допомогою кнопки вище.
</p>

</body>
</html>
