
<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма студента | Деканат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            background: #f4f6fb;
            color: #263347;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 { color: #203b67; }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, a {
            display: inline-block;
            padding: 10px 18px;
            margin-top: 20px;
            background: #3267bb;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">

    <h1 th:text="${student.id == null
        ? 'Додати студента'
        : 'Редагувати студента'}">
        Студент
    </h1>

    <form th:action="@{/students/save}"
          th:object="${student}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <label>Ім'я:</label>
        <input type="text"
               th:field="*{firstName}"
               placeholder="Введіть ім'я"
               required>

        <label>Прізвище:</label>
        <input type="text"
               th:field="*{lastName}"
               placeholder="Введіть прізвище"
               required>

        <label>Навчальна група:</label>
        <select th:field="*{groupId}" required>
            <option value="">Оберіть групу</option>

            <option th:each="group : ${groups}"
                    th:value="${group.id}"
                    th:text="${group.name}">
            </option>
        </select>

        <button type="submit">Зберегти</button>
        <a th:href="@{/students}">Скасувати</a>

    </form>
</div>

</body>
</html>
